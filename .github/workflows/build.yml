name: Build and Release
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-cmd: python3
            pip-cmd: pip3
            backend-name: backend-x86_64-unknown-linux-gnu
            python-arch: x64
          - os: macos-14
            target: x86_64-apple-darwin
            python-cmd: python3
            pip-cmd: pip3
            backend-name: backend-x86_64-apple-darwin
            python-arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            python-cmd: python3
            pip-cmd: pip3
            backend-name: backend-aarch64-apple-darwin
            python-arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-cmd: python
            pip-cmd: pip
            backend-name: backend-x86_64-pc-windows-msvc.exe
            python-arch: x64

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
          architecture: ${{ matrix.python-arch }}
          
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: install linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          
      - name: cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            
      - name: install frontend dependencies
        run: |
          npm install || (echo "Retrying npm install..." && npm install)

      - name: build python backend
        shell: bash
        run: |
          cd backend
          if [ "${{ runner.os }}" = "macOS" ]; then
            ${{ matrix.pip-cmd }} install torch torchvision || (echo "Retrying torch install..." && ${{ matrix.pip-cmd }} install torch torchvision)
          else
            ${{ matrix.pip-cmd }} install torch torchvision --index-url https://download.pytorch.org/whl/cpu || (echo "Retrying torch install..." && ${{ matrix.pip-cmd }} install torch torchvision --index-url https://download.pytorch.org/whl/cpu)
          fi
          ${{ matrix.pip-cmd }} install -r requirements.txt || (echo "Retrying requirements install..." && ${{ matrix.pip-cmd }} install -r requirements.txt)
          ${{ matrix.pip-cmd }} install pyinstaller || (echo "Retrying pyinstaller install..." && ${{ matrix.pip-cmd }} install pyinstaller)
          ${{ matrix.python-cmd }} -m PyInstaller --onefile --name backend --collect-all torchvision --collect-all transformers main.py || (echo "Retrying PyInstaller..." && ${{ matrix.python-cmd }} -m PyInstaller --onefile --name backend --collect-all torchvision --collect-all transformers main.py)
        
      - name: Move backend to src-tauri
        run: |
          mkdir -p src-tauri/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp backend/dist/backend.exe src-tauri/bin/backend.exe
          else
            cp backend/dist/backend src-tauri/bin/backend
            chmod +x src-tauri/bin/backend
          fi
        shell: bash

      - name: check tauri prerequisites
        shell: bash
        run: |
          echo "Checking Tauri prerequisites..."
          if [ ! -f "src-tauri/tauri.conf.json" ]; then
            echo "Error: tauri.conf.json not found"
            exit 1
          fi
          if [ ! -d "src-tauri/icons" ]; then
            echo "Error: icons directory not found"
            exit 1
          fi
          echo "Tauri prerequisites check passed"

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ startsWith(matrix.os, 'macos') && format('--target {0}', matrix.target) || '' }}
        continue-on-error: true

      - name: retry tauri build on failure
        if: failure()
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ startsWith(matrix.os, 'macos') && format('--target {0}', matrix.target) || '' }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Densync-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
